schema: gentle-ai.sdd-preproposal/v1
change: validation-signals
revision: 2
exploration:
  outcome: done
  reference:
    openspec: openspec/changes/validation-signals/exploration.md
    engram: sdd/validation-signals/explore
research:
  selected: false
  note: Owner skipped research on 2026-11-02.
product_decisions:
  status: confirmed
  confirmed:
    - id: S0
      decision: Scope closed by the owner on 2026-11-02. RF-05 (a)-(d) with RN-07, RN-09, RN-10, RN-14, RN-15 and the new RN-26 (repeated document - the file fingerprint matches a document of ANOTHER request; a correction of the same request does not trigger it). Deferred to RF-14 - RN-11, RN-12, RN-13, RN-24 and RF-05 (e). Out of scope - NS-12 and anomalous issuer volume across students. RN-26 is added to docs/requirements.md in this change.
    - id: S1
      decision: Each signal has three outcomes - present, absent, not evaluable (missing input data), the latter with a closed reason code.
    - id: V1
      decision: Three-state suggested verdict - "review carefully" when any signal is present; "no alerts" when none is present and all are evaluable; "inconclusive" when none is present and at least one is not evaluable. Not-evaluable signals are listed apart from the verdict. Display-only (RN-15, RF-05 d) - no write path reads it, covered by a test.
    - id: R26
      decision: RN-26 matches earlier-only - compare against requests presented before the current one (by presentadaEn, then id); the earlier request's signal never changes. Other side includes presented requests in any state (rechazada and devuelta included) and their retired documents; drafts, staff uploads and FormatoEspecial excluded on both sides. The other request id is shown only inside the caller's scope; otherwise "present" without reference; never names.
    - id: R10
      decision: RN-10 uses full containment - the union of recognised rest periods must cover the whole absence range [fechaInicio, fechaFin]. Days-only documents with an uncovered dated union yield not evaluable.
    - id: SNAP
      decision: Signals and verdict are computed on read only; no snapshot at decision time.
    - id: PRIV
      decision: Hashing and cross-request comparison are recorded as pending the UAM legal review; CONSENT_VERSION is not changed in this change. The validation runs on fictitious data.
    - id: BACKFILL
      decision: Documents uploaded before the change keep a NULL fingerprint, never match and make RN-26 not evaluable when they are the only current documents. No backfill.
    - id: DELIVERY
      decision: Chained slices on a tracker branch feat/validation-signals (feature-branch-chain), as in escalation. S1 pure evaluators + read assembly + secretary UI for RN-07, RN-09, RN-10, RN-14 (no schema); S2 fingerprint at finalize + RN-26 (migration 0013); S3 coordination view.
  defaults_from_exploration:
    - id: X1
      decision: Fingerprint computed at finalize through a single-stream extension of the DocumentStore port; nullable column HuellaSha256 char(64) with a hex check and a partial index. Special-format attach does not store it.
    - id: X2
      decision: RN-07 reuses deadlineOf with the first presentation date (presentadaEn); not evaluable when the calendar does not cover the deadline year.
    - id: X3
      decision: RN-14 normalizes the issuer in TypeScript; threshold is a constant passed as a params object (initial 3); period from Grupo.periodo. RNF-14 is not met until roadmap #8.
    - id: X4
      decision: Secretary detail gets a SignalsSection (fail-soft, no audit row beyond solicitud.consultada); coordination detail gets a read-only outcomes-and-labels projection; students see nothing; queue untouched.
constraints:
  - Migration 0013 must be generated by drizzle-kit, never hand-numbered; applying it needs the owner's explicit yes for that command.
  - Never touch the student or secretary validation Neon branches or their instances; fictitious data only.
  - System tests run on 2026-11-03; S1 should land first.
