  tasks: done     # 76 tasks, 5 phases, strict TDD, [CONFIRM] gates on every Neon command
  apply: in-progress   # 65/76 tasks; WU1b, WU1a, WU3a, WU3b delivered; WU2 code slice (5.1-5.17) committed, DB steps 5.18-5.28 pending
  verify: pending
  archive: pending
